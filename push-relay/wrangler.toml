name = "ovis-push-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
# Endpoints name push.ovis.sh (the ovis.sh zone must be on the deploying account): no second address.
workers_dev = false
routes = [{ pattern = "push.ovis.sh", custom_domain = true }]

# Workers Logs would keep each request, the sender's address with it: off.
[observability]
enabled = false

# APNS_KEY, APNS_KEY_ID and APNS_TEAM_ID are secrets (`wrangler secret put`, README.md), never here.
[vars]
APNS_TOPIC = "sh.ovis.app"

[[d1_databases]]
binding = "DB"
database_name = "ovis-push-relay"
# database_id: from `wrangler d1 create ovis-push-relay` (README.md), an id, not a secret. The
# database is not created yet; add its id here when it is.
